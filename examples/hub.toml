# hub.toml is optional. A new hub needs no file: start it, open the setup link it
# prints, and the guided first run in the web UI sets up the rest. Every setting except
# the three below can then be changed on the Settings page.
#
# Use this file for config as code. Anything set here, or in a DOMOVOI_* variable,
# wins over the web UI, and the UI shows it read-only with "Set in hub.toml". The
# order, lowest first: built-in defaults, the web UI, this file, the environment.
# See examples/hub.full.toml for every option, and validate a file with
# `domovoi check config hub.toml`.
#
# Secrets are never written here: use { env = "NAME" } or { file = "/path" }.

# Read only from this file or the environment, never from the web UI:
#
# [hub]
# data_dir = "/var/lib/domovoi"
#
# [web]
# bind = "127.0.0.1:7420"
#
# [agent_server]
# bind = "0.0.0.0:7421"

# Anything else, for example the daily digest, which the UI then shows locked:
#
# [notify]
# digest = { enabled = true, time = "08:00" }
#
# [discord]
# bot_token = { env = "DISCORD_BOT_TOKEN" }
# channel_id = 123456789012345678
# allowed_user_ids = [234567890123456789]
