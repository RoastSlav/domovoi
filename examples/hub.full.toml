# hub.full.toml: every hub.toml option, for running the hub as config as code.
#
# Every option is shown with its default unless marked "example". Validate this file
# with `domovoi check config hub.toml`; problems are reported with their TOML path.
#
# Secrets are never written here. Each secret is a table naming where the value lives:
#   { env = "NAME" }        read from an environment variable
#   { file = "/path" }      read from a file (chmod 600; one trailing newline is ignored)
#
# Any scalar can be overridden from the environment with DOMOVOI_<SECTION>__<KEY>,
# for example DOMOVOI_WEB__BIND=0.0.0.0:7420. Use a double underscore between levels.

[hub]
# Display name of this hub.
name = "domovoi"
# Where the database and state live.
data_dir = "/var/lib/domovoi"
# IANA time zone for quiet hours, digests and day boundaries.
timezone = "UTC"

[web]
# Address the web UI and HTTP API listen on. Keep it on localhost behind a proxy.
bind = "127.0.0.1:7420"
# The URL people use to reach the UI, used for links in chat (example; optional).
public_url = "https://domovoi.example.net"
# Reverse proxies whose X-Forwarded-For header is trusted (default: none).
trusted_proxies = ["127.0.0.1"]

[agent_server]
# Address agents connect to over mutually authenticated TLS.
bind = "0.0.0.0:7421"
# The address agents dial, printed in the enroll command (default: wss://<hub name>:<port>).
# public_url = "wss://domovoi.example.net:7421"
# Something outside your network the hub checks before it blames a silent host.
self_check = "1.1.1.1:53"
# How often agents check in. Three missed heartbeats mean the agent is silent.
heartbeat = "10s"

# Language model providers used by triage. The secondary is tried when the primary fails.
[llm.primary]
# "anthropic", "openai_compatible" or "cli".
kind = "anthropic"
# Model name; required for anthropic and openai_compatible (example).
model = "claude-sonnet-5-5"
# Fallback models of the same provider, tried in order when the model above fails
# (up to 5, only with anthropic or openai_compatible; example; optional).
# fallback_models = ["claude-haiku-4-5"]
# API key; required for anthropic.
api_key = { env = "ANTHROPIC_API_KEY" }
# API base URL: optional for anthropic, required for openai_compatible (example).
# base_url = "https://api.anthropic.com"
# The longest one model call may take in total, even while it keeps streaming.
call_deadline = "5m"
# The longest the model may stay silent; the clock restarts with every streamed token.
timeout = "2m"
# Prices used for the monthly budget, in US dollars per million tokens (example; optional).
price = { input_per_mtok_usd = 3.0, output_per_mtok_usd = 15.0 }

# With kind = "cli" the provider is a local command-line tool instead (example; optional).
# preset = "claude" or "codex" supplies the right arguments. command is the absolute path
# of the program to run instead of the preset's default; args, when not empty, replace the
# preset's arguments.
# [llm.primary.cli]
# preset = "claude"
# command = "/usr/local/bin/claude"
# args = []

# A local server that speaks the OpenAI chat API as the fallback (example; optional).
[llm.secondary]
kind = "openai_compatible"
# Required for openai_compatible.
base_url = "http://ollama.lan:11434/v1"
model = "llama3.1"
# Optional for a local server; keep it in an environment variable or a file.
api_key = { env = "OLLAMA_API_KEY" }
# Fallback models of the same provider (example; optional).
# fallback_models = ["llama3.2"]
call_deadline = "5m"
timeout = "2m"
# Local models usually cost nothing; set prices to count them against the budget (optional).
price = { input_per_mtok_usd = 0.0, output_per_mtok_usd = 0.0 }

# The secondary can be a local CLI as well, with the same keys as [llm.primary.cli].
# [llm.secondary.cli]
# preset = "codex"
# command = "/usr/local/bin/codex"
# args = []

[triage]
# Whether new incidents are triaged automatically (default false). Needs [llm.primary].
enabled = true
# Triage runs at the same time.
concurrency = 2
# Runs started per hour at most.
per_hour_runs = 6
# Spending cap per calendar month in US dollars (example; optional, default no cap).
monthly_budget_usd = 20.0
# Days a triage report is reused when the evidence has not changed.
cache_days = 7
# Runs of each hour kept free for incident triage: questions and chat may not use the last
# ones. Must be less than per_hour_runs (default: 2, or one fewer when per_hour_runs is smaller).
reserved_for_incidents = 2

[triage.per_run]
# Output tokens per model turn.
output_tokens = 2000
# Wall-clock seconds per run.
seconds = 90
# Tool calls per run.
tool_calls = 15
# Largest prompt sent in one model call, in bytes.
prompt_bytes = 131072
# Output tokens one run may ask for in total (optional; default: derived from the limits above).
# total_tokens = 40000

[incidents]
# Consecutive failing runs before an incident opens.
confirm_runs = 2
# A resolved incident that fails again within this window reopens instead of opening anew.
reopen_window = "6h"
# Signals on one host this close together are grouped into one notification.
grouping_window = "5m"
# Incidents with no new signal for this long resolve (example; optional, default never).
default_ttl = "3d"

[notify]
# Warnings wait until quiet hours end; critical alerts are always sent. The range may
# cross midnight (example; optional, default no quiet hours).
quiet_hours = { start = "00:00", end = "09:00" }
# How often an unacknowledged incident is announced again, by severity.
renotify = { warning = "24h", critical = "4h" }
# The daily digest and the local time it is sent.
digest = { enabled = true, time = "09:00" }

# The Discord bot (optional; omit the section to run without Discord).
[discord]
# Whether the bot runs.
enabled = true
# The bot token.
bot_token = { env = "DISCORD_BOT_TOKEN" }
# The channel incidents are posted to (example).
channel_id = 123456789012345678
# Numeric Discord user IDs (not usernames or tags) allowed to press buttons and run commands;
# required when enabled (example). Enable Discord Developer Mode, then use Copy User ID.
allowed_user_ids = [234567890123456789]
# A channel webhook that carries digests and quiet-hours summaries instead of the bot
# (optional).
webhook_url = { env = "DISCORD_WEBHOOK_URL" }

# Inbound webhooks, one table per name; the name appears in the URL
# /hooks/<name>. Names use a-z, 0-9, '-' and '_' (example; optional).
[webhooks.alerts]
# Payload format: "generic", "alertmanager" or "uptime_kuma".
kind = "alertmanager"
# "hmac" verifies an HMAC-SHA256 signature of the body; "bearer" checks a token.
auth = "bearer"
# The HMAC key or bearer token.
secret = { env = "DOMOVOI_ALERTS_TOKEN" }
# Host used when the payload names none (optional).
default_host = "nas"
# For Alertmanager, the label naming the host (default: "host", then "instance" without port).
host_label = "host"

# Network probes run from the hub (example; optional, repeat the table for more).
[[probes]]
# The host the probe reports on.
host = "nas"
# "tcp" opens a connection; "http" sends a GET.
kind = "http"
# host:port for tcp, an http or https URL for http.
target = "https://nas.lan:5001/"
# How often it runs.
interval = "1m"
# The status that counts as healthy; required for http, not allowed for tcp.
expect_status = 200

[[probes]]
host = "nas"
kind = "tcp"
target = "nas.lan:22"
interval = "1m"

# A dead man's switch pinged while the hub is healthy (optional; omit to disable).
[heartbeat]
# The URL pinged; it usually embeds a token, so it is a secret.
url = { env = "DOMOVOI_HEARTBEAT_URL" }
# How often it is pinged.
interval = "1m"

[backup]
# Where database backups are written (default: <data_dir>/backups).
dir = "/var/lib/domovoi/backups"
# Backups kept.
keep = 7
# Backups taken before a database migration that are kept.
keep_pre_migrate = 3

[secrets]
# Names of secrets you know were exposed; each raises an advisory until you rotate the
# secret and remove its name here (default: none).
exposed = []

[metrics]
# Bearer token a Prometheus scraper sends as `Authorization: Bearer <token>`. Without it,
# only a logged-in web session can read /metrics (optional).
token = { env = "DOMOVOI_METRICS_TOKEN" }

[updates]
# Look for a newer Domovoi release on GitHub twice a day. Nothing is sent but the request.
check = true

# The operation service: durable multi-step investigations with per-step approvals. Read
# once at start, so a change needs a restart.
[orchestration]
# Investigate new incidents as operations. false switches off automatic investigation
# (alert cards still go out) and the operation service.
enabled = true
# Operations that may be running, waiting or paused at once; the rest queue.
max_running = 4
# How long a proposed action waits for a person to approve it. At most "7d".
approval_ttl = "24h"
# How long a question waits for an answer.
question_timeout = "24h"
# How long an approved action waits for its host's agent to come back.
agent_wait_limit = "30m"
# Runs of one skill on one host allowed per hour before the loop guard refuses the next.
loop_guard_per_hour = 3

# Limits an operation starts with.
[orchestration.budgets]
cycles = 3
evidence_requests = 40
executions = 5
model_turns = 20
tokens = 200000
wall_time = "72h"
# Model cost in millionths of a currency unit (optional, default no limit).
# cost_micros = 5000000

# Policy rules the hub evaluates. Nothing runs unattended unless a published rule allows it
# and the agent's own [unattended] ceiling covers it.
[policy]
# Record, for every Execution step, what the active policy and its shadow rules would decide.
shadow = false
# How long a policy permit stays valid, capped by the step's own approval window.
permit_ttl = "5m"
# Permits issued per rolling hour, all rules together. 0 means no permit is ever issued.
max_permits_per_hour = 12
# Failed or unknown results of permit-authorized steps that suspend a rule within the window.
circuit_failures = 2
circuit_window = "24h"

# Signed agent packages (optional; off by default). Importing and installing always needs
# a person's approval.
[packages]
enabled = false
# Largest archive accepted on import, in bytes.
max_artifact_bytes = 20971520
# Most bytes of archives the hub keeps.
max_store_bytes = 536870912
# Most archives the hub keeps.
max_artifacts = 64
# How long a person's approval to install stays valid.
approval_window = "10m"
# Days finished install jobs are kept.
job_history_days = 180
# Key ids (16 lowercase hex characters) whose packages are never accepted.
revoked = []

# Keys whose signatures the hub accepts on import; each key id is the first 16 hex characters
# of the SHA-256 of the raw public key. Read from the file only (example; repeat for more).
# [[packages.owner_keys]]
# id = "0123456789abcdef"
# label = "release signing key"
# public_key = "<the Ed25519 public key, 32 bytes in padded base64>"

# How long each kind of raw data is kept, in days.
[retention]
signals_days = 30
incident_timeline_days = 90
conversations_days = 180
notifications_days = 30
resolved_advisories_days = 30
triage_cache_days = 90
retracted_facts_days = 30
execution_outputs_days = 30
operation_journal_days = 180
