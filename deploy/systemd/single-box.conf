# Single-box mode: the hub also runs an agent for this machine, in the same process.
# Install with:
#   mkdir -p /etc/systemd/system/domovoi-hub.service.d
#   cp single-box.conf /etc/systemd/system/domovoi-hub.service.d/
#   systemctl daemon-reload && systemctl restart domovoi-hub
#
# The local agent inherits the hub's unprivileged sandbox: checks that need root (SMART,
# the journal) and skills that switch users report errors. When you need those, run the
# agent as its own unit (domovoi-agent.service) instead.
#
# /etc/domovoi/agent.toml needs only [agent] host_name and hub_url (any wss:// URL; the
# local agent does not dial it), and state_dir = "/var/lib/domovoi/agent".

[Service]
ExecStart=
ExecStart=/usr/local/bin/domovoi hub run --with-local-agent /etc/domovoi/agent.toml
