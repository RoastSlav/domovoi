# Standalone scratch harness for R-10 (helper safety attestation research).
# Its own workspace: it is NOT a member of the repository workspace and must not become one.
[workspace]

[package]
name = "r10-harness"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "r10"
path = "src/lib.rs"

[[bin]]
name = "r10_child"
path = "src/bin/r10_child.rs"

# Versions mirror the repository's [workspace.dependencies] so the reproduction is close to
# what production would use. The repository manifest is not touched.
[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23.1"
toml = "1.1.8"
rand = "0.10.3"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
