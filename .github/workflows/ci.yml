name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(engine): add digest builder'"
            exit 1
          fi

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated API types are up to date (ARCHITECTURE.md R12)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  rust:
    name: Rust (fmt, clippy, tests, docs, arch-check)
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=pass
      - name: Doctests
        run: cargo test --workspace --doc --locked
      - name: Feature-gated checks (clippy, tests, rustdoc)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --package domovoi-checks --all-features --all-targets --locked -- -D warnings
          cargo test --package domovoi-checks --all-features --locked
          cargo doc --package domovoi-checks --all-features --no-deps --locked
      - name: Architecture rules
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo xtask arch-check --base "origin/${{ github.base_ref }}"
          else
            cargo xtask arch-check
          fi
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Build with the embedded web UI
        run: cargo build --package domovoi --features embed-ui --locked

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check on the rust-version from Cargo.toml
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --locked

  musl:
    name: Static musl build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo check --workspace --locked --target x86_64-unknown-linux-musl

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  coverage:
    name: Coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --locked --no-tests=pass --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
