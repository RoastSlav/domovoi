name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly: only the privileged job runs (see the classifier).
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-scheduled' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
      embedded_ui: ${{ steps.classify.outputs.embedded_ui }}
      architecture: ${{ steps.classify.outputs.architecture }}
      openapi: ${{ steps.classify.outputs.openapi }}
      config_docs: ${{ steps.classify.outputs.config_docs }}
      docs_links: ${{ steps.classify.outputs.docs_links }}
      metadata_only: ${{ steps.classify.outputs.metadata_only }}
      deny: ${{ steps.classify.outputs.deny }}
      msrv: ${{ steps.classify.outputs.msrv }}
      musl: ${{ steps.classify.outputs.musl }}
      workflow: ${{ steps.classify.outputs.workflow }}
      shell: ${{ steps.classify.outputs.shell }}
      installer: ${{ steps.classify.outputs.installer }}
      units: ${{ steps.classify.outputs.units }}
      coverage: ${{ steps.classify.outputs.coverage }}
      privileged: ${{ steps.classify.outputs.privileged }}
      containment: ${{ steps.classify.outputs.containment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          outputs=(rust web embedded_ui architecture openapi config_docs docs_links metadata_only deny msrv musl workflow shell installer units coverage privileged containment)
          fail_open() {
            echo "::warning::Could not determine the changed files; running all CI checks."
            for output in "${outputs[@]}"; do
              echo "$output=true" >> "$GITHUB_OUTPUT"
            done
          }

          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            # Nightly and manual runs only exercise the privileged job.
            for output in "${outputs[@]}"; do
              if [[ "$output" == privileged ]]; then
                echo "$output=true" >> "$GITHUB_OUTPUT"
              else
                echo "$output=false" >> "$GITHUB_OUTPUT"
              fi
            done
            exit 0
          fi

          case "$EVENT_NAME" in
            pull_request|merge_group) base="$BASE_SHA" ;;
            push) base="$BEFORE_SHA" ;;
            *) base="" ;;
          esac
          head="$HEAD_SHA"

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            fail_open
            exit 0
          fi
          if ! git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed-files"; then
            fail_open
            exit 0
          fi

          rust=false
          web=false
          embedded_ui=false
          architecture=false
          openapi=false
          config_docs=false
          docs_links=false
          metadata_only=false
          deny=false
          msrv=false
          musl=false
          workflow=false
          shell=false
          installer=false
          units=false
          coverage=false
          privileged=false
          containment=false
          ci_workflow=false
          cargo_files=false
          release_files_only=true

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/config|.cargo/config.toml|.cargo/*)
                rust=true
                architecture=true
                deny=true
                msrv=true
                musl=true
                cargo_files=true
                ;;
              deny.toml)
                deny=true
                release_files_only=false
                ;;
              crates/*)
                if [[ "$file" != *.md ]]; then
                  rust=true
                  architecture=true
                fi
                case "$file" in
                  crates/domovoi-hub/src/api/*|crates/domovoi-hub/src/router.rs)
                    openapi=true
                    ;;
                  crates/domovoi-config/*)
                    config_docs=true
                    ;;
                  crates/domovoi-helper/*)
                    privileged=true
                    ;;
                  crates/domovoi-hub/src/spa.rs|crates/domovoi-hub/Cargo.toml|crates/domovoi/Cargo.toml)
                    embedded_ui=true
                    ;;
                esac
                case "$file" in
                  crates/domovoi-core/src/containment/*|crates/domovoi-helper/src/nft/*|crates/domovoi-helper/tests/nft_ns/*|crates/domovoi-agent/src/containment/*)
                    containment=true
                    ;;
                esac
                if [[ "$file" == crates/domovoi/src/cmd/mod.rs ]]; then
                  openapi=true
                  config_docs=true
                fi
                release_files_only=false
                ;;
              xtask/*)
                if [[ "$file" != *.md ]]; then
                  rust=true
                  architecture=true
                fi
                case "$file" in
                  xtask/src/openapi.rs) openapi=true ;;
                  xtask/src/docs_config.rs) config_docs=true ;;
                  xtask/src/docs_links.rs) docs_links=true ;;
                esac
                release_files_only=false
                ;;
              ARCHITECTURE.md|docs/adr/*.md)
                architecture=true
                release_files_only=false
                ;;
              CHANGELOG.md)
                ;;
              docs/book/*)
                docs_links=true
                release_files_only=false
                if [[ "$file" == docs/book/src/reference/configuration.md ]]; then
                  config_docs=true
                fi
                ;;
              web/*)
                if [[ "$file" != *.md && "$file" != web/LICENSE* ]]; then
                  web=true
                  embedded_ui=true
                fi
                release_files_only=false
                # cargo xtask docs-links checks the UI's docs="..." targets against the book, so a
                # UI source change has to run it, not just the web job.
                if [[ "$file" == web/src/* ]]; then
                  docs_links=true
                fi
                if [[ "$file" == web/src/api/openapi.json ]]; then
                  openapi=true
                fi
                ;;
              .github/workflows/*)
                workflow=true
                release_files_only=false
                if [[ "$file" == .github/workflows/ci.yml ]]; then
                  ci_workflow=true
                fi
                ;;
              install.sh|deploy/test/*.sh|deploy/test/*/run|examples/skills/*/run)
                shell=true
                release_files_only=false
                if [[ "$file" == install.sh || "$file" == deploy/* ]]; then
                  privileged=true
                fi
                if [[ "$file" == install.sh || "$file" == deploy/test/installer.sh ]]; then
                  installer=true
                fi
                ;;
              deploy/systemd/*)
                units=true
                privileged=true
                release_files_only=false
                ;;
              deploy/*)
                privileged=true
                release_files_only=false
                ;;
              *)
                release_files_only=false
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          if [[ "$cargo_files" == true && "$release_files_only" == true ]]; then
            version_changes_only=true
            while IFS= read -r line; do
              [[ "$line" == ---* || "$line" == +++* || "$line" == @@* ]] && continue
              if [[ "$line" =~ ^[+-][[:space:]]*version[[:space:]]*=[[:space:]]*\"[^\"[:space:]]+\"[[:space:]]*$ ]]; then
                continue
              fi
              if [[ "$line" == +* || "$line" == -* ]]; then
                version_changes_only=false
              fi
            done < <(git diff --unified=0 "$base" "$head" -- Cargo.toml Cargo.lock)

            if [[ "$version_changes_only" == true && "$ci_workflow" == false ]]; then
              rust=false
              architecture=false
              deny=false
              msrv=false
              musl=false
              coverage=false
              metadata_only=true
            fi
          fi

          if [[ "$ci_workflow" == true ]]; then
            rust=true
            web=true
            embedded_ui=true
            architecture=true
            openapi=true
            config_docs=true
            docs_links=true
            deny=true
            msrv=true
            musl=true
            workflow=true
            shell=true
            installer=true
            units=true
            coverage=true
            privileged=true
            containment=true
            metadata_only=false
          fi

          if [[ "$rust" == true ]]; then
            coverage=true
          fi

          for output in "${outputs[@]}"; do
            case "$output" in
              rust) value="$rust" ;;
              web) value="$web" ;;
              embedded_ui) value="$embedded_ui" ;;
              architecture) value="$architecture" ;;
              openapi) value="$openapi" ;;
              config_docs) value="$config_docs" ;;
              docs_links) value="$docs_links" ;;
              metadata_only) value="$metadata_only" ;;
              deny) value="$deny" ;;
              msrv) value="$msrv" ;;
              musl) value="$musl" ;;
              workflow) value="$workflow" ;;
              shell) value="$shell" ;;
              installer) value="$installer" ;;
              units) value="$units" ;;
              coverage) value="$coverage" ;;
              privileged) value="$privileged" ;;
              containment) value="$containment" ;;
            esac
            echo "$output=$value" >> "$GITHUB_OUTPUT"
          done

  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(engine): add digest builder'"
            exit 1
          fi

  # The web checks run as separate jobs side by side, and `web` below gathers them under the name
  # the branch ruleset requires.
  web-lint:
    name: Web lint, format and API types
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Generated API types are up to date (ARCHITECTURE.md R12)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api

  web-test:
    name: Web tests (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/3

  # The one place the UI is built: the browser smoke test and the embedded-UI job both take this
  # artifact. The build runs the type check and the bundle size budget.
  web-build:
    name: Build web UI
    needs: changes
    if: needs.changes.outputs.embedded_ui == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  web-smoke:
    name: Web browser smoke test
    needs: [changes, web-build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries (browser restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser smoke test
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-smoke-out
          path: web/smoke-out
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web (lint, typecheck, test, build)
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
    needs: [changes, web-lint, web-test, web-build, web-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Every web job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              echo "::error::A web job did not pass (results: $RESULTS)."
              exit 1
            fi
          done

  docs-links:
    name: Book links, anchors and pages
    needs: changes
    if: needs.changes.outputs.docs_links == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: docs
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true
      - run: cargo xtask docs-links

  metadata:
    name: Locked workspace metadata
    needs: changes
    if: needs.changes.outputs.metadata_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  # The Rust checks run as three jobs side by side (lint, tests, repository checks), and `rust`
  # below gathers them under the name the branch ruleset requires.
  rust-lint:
    name: Rust lint (fmt, clippy, feature-gated)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: rust-lint
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Feature-gated checks (clippy, tests, rustdoc)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --package domovoi-checks --all-features --all-targets --locked -- -D warnings
          cargo test --package domovoi-checks --all-features --locked
          cargo clippy --package domovoi-checks --no-default-features --features net --all-targets --locked -- -D warnings
          cargo doc --package domovoi-checks --all-features --no-deps --locked

  rust-test:
    name: Rust tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: rust
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=pass
      - name: Doctests
        run: cargo test --workspace --doc --locked
      # The tests build the binary; the real-accounts job runs that same file instead of
      # compiling it again.
      - name: Keep the debug binary for the real-accounts job
        if: needs.changes.outputs.privileged == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: domovoi-debug-bin
          path: target/debug/domovoi
          retention-days: 1
          if-no-files-found: ignore

  rust-checks:
    name: Rust repository checks (arch, OpenAPI, docs)
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && (
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.architecture == 'true' ||
      needs.changes.outputs.openapi == 'true' ||
      needs.changes.outputs.config_docs == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: rust-checks
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true
      - name: Architecture rules
        if: needs.changes.outputs.architecture == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo xtask arch-check --base "origin/${{ github.base_ref }}"
          else
            cargo xtask arch-check
          fi
      - name: OpenAPI document is up to date (ARCHITECTURE.md R12)
        if: needs.changes.outputs.openapi == 'true'
        run: cargo xtask openapi --check
      - name: Configuration reference is up to date
        if: needs.changes.outputs.config_docs == 'true'
        run: cargo xtask docs-config --check
      - name: Rustdoc
        if: needs.changes.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  rust:
    name: Rust (fmt, clippy, tests, docs, arch-check)
    if: ${{ !cancelled() }}
    needs: [changes, rust-lint, rust-test, rust-checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Every Rust job passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [[ "$CHANGES_RESULT" == success ]] || { echo "::error::Could not classify changed files."; exit 1; }
          for result in $RESULTS; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              echo "::error::A Rust job did not pass (results: $RESULTS)."
              exit 1
            fi
          done

  embedded-ui:
    name: Embedded UI (build, hub clippy, tests)
    if: ${{ !cancelled() && needs.changes.outputs.embedded_ui == 'true' }}
    needs: [changes, web-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the web build
        env:
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
        run: |
          [[ "$WEB_BUILD_RESULT" == success ]] || { echo "::error::The web build did not pass."; exit 1; }
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Restores the cache the Rust test job saves on main: the dependencies are the same, so
      # only the workspace crates compile here. Nothing is saved from this job.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: rust
          save-if: false
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Hub with embedded UI (clippy, tests)
        run: |
          cargo clippy --package domovoi-hub --features embed-ui --all-targets --locked -- -D warnings
          cargo test --package domovoi-hub --features embed-ui --locked
      - name: The application builds with the embedded UI
        run: cargo check --package domovoi --features embed-ui --locked

  gate:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, pr-title, web, web-build, docs-links, metadata, rust, embedded-ui, deny, msrv, musl, actionlint, shellcheck, installer, units]
    runs-on: ubuntu-24.04
    steps:
      - name: Every check that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              echo "::error::A required CI job did not pass (results: $RESULTS)."
              exit 1
            fi
          done

  deny:
    name: Supply chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.msrv == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true
      - name: Check on the rust-version from Cargo.toml
        run: cargo "+${{ steps.msrv.outputs.version }}" check --workspace --locked

  musl:
    name: Static musl build check
    needs: changes
    if: needs.changes.outputs.musl == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: musl
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true
      - run: cargo check --workspace --locked --target x86_64-unknown-linux-musl

  actionlint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  shellcheck:
    name: Shell scripts lint
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh deploy/test/*.sh examples/skills/*/run

  installer:
    name: Installer on ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - name: Tools the test needs
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl python3
      - uses: actions/checkout@v7
      - name: Install, upgrade, keep edits, refuse a bad checksum
        run: sh deploy/test/installer.sh

  units:
    name: systemd units verify
    needs: changes
    if: needs.changes.outputs.units == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: systemd-analyze verify
        run: |
          # verify checks that ExecStart exists; a stub stands in for the binary.
          printf '#!/bin/sh\n' | sudo tee /usr/local/bin/domovoi >/dev/null
          sudo chmod 0755 /usr/local/bin/domovoi
          # The helper service is a template (domovoi-helper@.service); verify takes the file as is.
          # The agent unit Wants the helper socket, so all four go in one run.
          systemd-analyze verify --man=no deploy/systemd/domovoi-hub.service deploy/systemd/domovoi-agent.service deploy/systemd/domovoi-helper.socket deploy/systemd/domovoi-helper@.service
      - name: Render and verify the skill runner units
        run: |
          # The runner units name User=domovoi-skill and Group=domovoi-skill, so both accounts
          # exist first. verify proves syntax only: it is silent about a mask that fails the
          # start with 226/NAMESPACE, which deploy/test/skill-runner.sh measures.
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin domovoi-agent
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin domovoi-skill
          sudo install -d /etc/domovoi/skills /var/lib/domovoi-packages
          # The default rendering, and one for other directories, both through install.sh's own text.
          mkdir -p "$RUNNER_TEMP/units"
          sh install.sh --print-unit runner-socket > "$RUNNER_TEMP/units/domovoi-skill-runner.socket"
          sh install.sh --print-unit runner-service > "$RUNNER_TEMP/units/domovoi-skill-runner@.service"
          cmp "$RUNNER_TEMP/units/domovoi-skill-runner.socket" deploy/systemd/domovoi-skill-runner.socket
          cmp "$RUNNER_TEMP/units/domovoi-skill-runner@.service" deploy/systemd/domovoi-skill-runner@.service
          systemd-analyze verify --man=no "$RUNNER_TEMP/units/domovoi-skill-runner.socket" "$RUNNER_TEMP/units/domovoi-skill-runner@.service"
          sudo install -d /srv/skills /srv/packages
          mkdir -p "$RUNNER_TEMP/custom"
          cp "$RUNNER_TEMP/units/domovoi-skill-runner.socket" "$RUNNER_TEMP/custom/"
          sed -e 's|/etc/domovoi/skills|/srv/skills|g' -e 's|/var/lib/domovoi-packages|/srv/packages|g' \
            "$RUNNER_TEMP/units/domovoi-skill-runner@.service" > "$RUNNER_TEMP/custom/domovoi-skill-runner@.service"
          systemd-analyze verify --man=no "$RUNNER_TEMP/custom/domovoi-skill-runner.socket" "$RUNNER_TEMP/custom/domovoi-skill-runner@.service"

  # Needs a machine that boots with systemd as PID 1. Not in the required `needs:` list of
  # the gate job until it has run green three times in a row and the owner agrees; until
  # then its result is recorded in the pull request.
  privileged:
    name: Real accounts and systemd units
    needs: [changes, rust-test]
    if: ${{ !cancelled() && needs.changes.outputs.privileged == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Is systemd PID 1 on this runner?
        run: |
          systemctl --version | sed -n 1p
          stat -fc %T /sys/fs/cgroup
          ps -p 1 -o comm=
          if [ "$(ps -p 1 -o comm= | tr -d ' ')" != systemd ]; then
            echo "::error::PID 1 is not systemd on this runner image, so the real-account tests cannot run here. Run deploy/test/identities.sh on a virtual machine that boots with systemd."
            exit 1
          fi
      # The Rust test job builds the same binary; the nightly run has no such job, so it builds.
      - name: The binary from the Rust test job
        id: binary
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: domovoi-debug-bin
          path: target/debug
      - name: Install the pinned toolchain from rust-toolchain.toml
        if: steps.binary.outcome != 'success'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        if: steps.binary.outcome != 'success'
        with:
          shared-key: rust
          save-if: false
          cache-on-failure: true
      - name: Build the binary
        if: steps.binary.outcome != 'success'
        run: cargo build --package domovoi --locked
      - name: Make the binary executable
        run: chmod 0755 target/debug/domovoi
      - name: Install and migrate with real accounts, run the helper in a real unit
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" DOMOVOI_PRIVILEGED_TESTS=1 \
            DOMOVOI_BIN="$PWD/target/debug/domovoi" sh deploy/test/identities.sh
      # Not in the gate's `needs:` list either. It may find that this runner image cannot host
      # it (no cgroup v2, or no systemd as PID 1); the step prints the facts first.
      - name: Run the skill runner in real units, with the systemd canaries
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" DOMOVOI_PRIVILEGED_TESTS=1 \
            DOMOVOI_BIN="$PWD/target/debug/domovoi" sh deploy/test/skill-runner.sh

  # Namespace tests for the helper's nft group: a real `nft` in a throwaway network namespace,
  # started with `sudo unshare`, never `unshare --user --map-root-user` (recent Ubuntu refuses
  # unprivileged user namespaces under AppArmor). Not in the gate's `needs:` list until it has
  # run green three times in a row and the owner agrees. The load tests that send packets
  # are in containment-leak.yml and are never required.
  containment-ns:
    name: Containment namespace tests
    needs: changes
    if: needs.changes.outputs.containment == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install nftables, iproute2 and conntrack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 conntrack
      - name: Print the kernel and nft versions
        run: |
          uname -r
          nft --version
          if ! sudo modprobe nf_flow_table 2>/dev/null; then
            echo "::notice::nf_flow_table is not available; the tests that need it skip and say so."
          fi
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: containment-ns
          save-if: false
          cache-on-failure: true
      - name: Build the namespace tests
        run: cargo test --package domovoi-helper --test nft_ns --locked --no-run
      - name: Run the namespace tests as root in a new network and mount namespace
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" DOMOVOI_NS_TESTS=1 \
            unshare --net --mount sh -c 'mount -t tmpfs tmpfs /run && ip link set lo up && cargo test --package domovoi-helper --test nft_ns --locked -- --nocapture'

  coverage:
    name: Coverage
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: coverage
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --locked --no-tests=pass --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
