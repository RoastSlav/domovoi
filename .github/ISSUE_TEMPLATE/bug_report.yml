name: Bug report
description: Something does not work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues go through private reporting, not here** (see SECURITY.md).
        Remove secrets, tokens and hostnames you do not want public from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Domovoi version
      description: Output of `domovoi version`.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Affected role
      options: [hub, agent, single-box, web UI, Discord, not sure]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and version, install method (binary, Docker, container-mode agent), architecture.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run with `--log-level debug` if you can. Redact secrets.
      render: text
