# cargo-deny configuration. Run with `cargo deny check`.
# ARCHITECTURE.md R11: licenses must be compatible with MIT OR Apache-2.0, no OpenSSL.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # sqlx 0.9.0 (the newest release) bundles SQLite 3.53.2 through libsqlite3-sys
    # 0.37.0 and pins that line, so the patched bundle (0.39.0, SQLite 3.54.0) is
    # unreachable while the store stays on sqlx. Tracked for the store bump.
    "RUSTSEC-2026-0459",
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", reason = "rustls only (ARCHITECTURE.md R11)" },
    { crate = "openssl-sys", reason = "rustls only (ARCHITECTURE.md R11)" },
    { crate = "native-tls", reason = "rustls only (ARCHITECTURE.md R11)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
