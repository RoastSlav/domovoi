[package]
name = "domovoi-checks"
description = "Built-in host checks and network probes for Domovoi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Host checks that read /proc, /sys, logs and Docker. Enabled by the agent.
host = ["dep:nix", "dep:bollard", "dep:futures", "tokio/fs", "tokio/io-util"]
# Network probes (TCP, HTTP, gateway reachability). Used by agent and hub.
net = ["dep:reqwest", "dep:url", "dep:rustls", "dep:rustls-platform-verifier", "tokio/net"]
# Parsers for webhook payloads (generic, Alertmanager, Uptime Kuma). Pure; used by agent and hub.
sources = []

[dependencies]
domovoi-core = { workspace = true }
async-trait = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
bollard = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }

[dev-dependencies]
domovoi-testkit = { workspace = true }
proptest = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "net", "io-util"] }
uuid = { workspace = true }

[[test]]
name = "system"
path = "tests/system/main.rs"
required-features = ["host"]

[[test]]
name = "services"
path = "tests/services/main.rs"
required-features = ["host"]

[[test]]
name = "sources"
path = "tests/sources/main.rs"
required-features = ["sources"]

[[test]]
name = "probes"
path = "tests/probes/main.rs"
required-features = ["net"]

[lints]
workspace = true
