[package]
name = "domovoi-engine"
description = "Application services for Domovoi: correlation, incidents, notification policy, triage, approvals and digests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[dependencies]
domovoi-core = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
metrics = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
domovoi-llm = { workspace = true }
domovoi-testkit = { workspace = true }
serde_norway = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "engine"
path = "tests/engine/main.rs"

[[test]]
name = "drills"
path = "tests/drills/drills.rs"

[[test]]
name = "notify"
path = "tests/notify/main.rs"

[[test]]
name = "services"
path = "tests/services/main.rs"

[lints]
workspace = true
