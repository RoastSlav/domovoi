[package]
name = "domovoi"
description = "Self-hosted server overseer: AI triage, chat, and human-approved actions. Hub and agent in one binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["monitoring", "homelab", "self-hosted", "llm", "incident"]
categories = ["command-line-utilities"]

[[bin]]
name = "domovoi"
path = "src/main.rs"

[features]
default = []
# Embed the built web UI (web/dist) into the binary.
embed-ui = ["domovoi-hub/embed-ui"]

[dependencies]
domovoi-core = { workspace = true }
domovoi-config = { workspace = true }
domovoi-hub = { workspace = true }
domovoi-agent = { workspace = true }
domovoi-runner = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
async-trait = { workspace = true }
domovoi-checks = { workspace = true, features = ["host"] }
domovoi-proto = { workspace = true }
domovoi-testkit = { workspace = true }
jiff = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
