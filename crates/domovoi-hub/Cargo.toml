[package]
name = "domovoi-hub"
description = "Domovoi hub runtime: HTTP API, web UI, auth, webhook ingest, agent server and engine wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# tests/gates.rs is built into the hub test binary, which owns its helpers.
autotests = false

[features]
default = []
# Embed the built React app from web/dist. Requires `npm run build` in web/ first;
# without it the hub serves a page explaining how to build the UI.
embed-ui = []

[dependencies]
domovoi-core = { workspace = true }
domovoi-config = { workspace = true }
domovoi-proto = { workspace = true }
domovoi-engine = { workspace = true }
domovoi-store = { workspace = true }
domovoi-llm = { workspace = true }
domovoi-chat = { workspace = true }
domovoi-checks = { workspace = true, features = ["net", "sources"] }
argon2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "multipart"] }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "set-header", "limit", "timeout", "compression-gzip", "sensitive-headers"] }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
domovoi-testkit = { workspace = true }
insta = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[[test]]
name = "hub"
path = "tests/hub/main.rs"

[[test]]
name = "ingest"
path = "tests/ingest/main.rs"

[lints]
workspace = true
